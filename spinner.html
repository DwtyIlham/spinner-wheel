<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roda Spinner - Multi Kategori</title>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --accent-color: #f59e0b;
        --accent-hover: #d97706;
        --text-color: #f8fafc;
        --border-color: #334155;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .spinner-card {
        background: var(--card-bg);
        padding: 30px;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--border-color);
        position: relative;
        width: 100%;
        max-width: 520px;
      }

      .header-actions {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }

      .back-link,
      .reset-btn {
        color: #94a3b8;
        text-decoration: none;
        font-size: 0.85rem;
        background: none;
        border: none;
        cursor: pointer;
        transition: color 0.2s;
      }

      .back-link:hover,
      .reset-btn:hover {
        color: var(--accent-color);
      }

      /* Tab Kategori Switcher */
      .category-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        width: 100%;
        margin-bottom: 15px;
      }

      .tab-btn {
        padding: 8px 12px;
        background: #0f172a;
        border: 1px solid var(--border-color);
        color: #94a3b8;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .tab-btn.active {
        background: var(--accent-color);
        color: #000;
        border-color: var(--accent-color);
        font-weight: 800;
      }

      .wheel-wrapper {
        position: relative;
        width: 340px;
        height: 340px;
        margin-top: 5px;
      }

      .pointer {
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 16px solid transparent;
        border-right: 16px solid transparent;
        border-top: 32px solid #ef4444;
        z-index: 10;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.7));
      }

      canvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      }

      .btn-spin {
        margin-top: 25px;
        padding: 15px 50px;
        background: var(--accent-color);
        color: #000;
        border: none;
        border-radius: 50px;
        font-weight: 800;
        font-size: 1.3rem;
        letter-spacing: 1px;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
        transition: all 0.2s ease;
      }

      .btn-spin:hover:not(:disabled) {
        background: var(--accent-hover);
        transform: translateY(-2px);
        box-shadow: 0 6px 25px rgba(245, 158, 11, 0.6);
      }

      .btn-spin:disabled {
        background: #475569;
        color: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
      }

      /* Vocal Point Display Hasil */
      .result-container {
        margin-top: 25px;
        width: 100%;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d16;
        border-radius: 14px;
        border: 2px solid #334155;
        padding: 15px 20px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .result-container.active {
        border-color: var(--accent-color);
        box-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
        background: #111827;
      }

      .result-label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #94a3b8;
        margin-bottom: 6px;
        font-weight: 700;
      }

      .result-value {
        font-size: 2.6rem;
        font-weight: 900;
        color: #f59e0b;
        text-align: center;
        word-break: break-word;
        line-height: 1.1;
        text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
      }

      .result-value.animate {
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.4);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="spinner-card">
      <div class="header-actions">
        <a href="index.html" class="back-link">⚙️ Edit Pengaturan</a>
        <button class="reset-btn" onclick="resetDisabledItems()">
          🔄 Reset Kategori Ini
        </button>
      </div>

      <!-- Switcher Kategori -->
      <div class="category-tabs">
        <button
          class="tab-btn"
          data-cat="SD_PA"
          onclick="switchCategory('SD_PA')"
        >
          SD PA
        </button>
        <button
          class="tab-btn"
          data-cat="SD_PI"
          onclick="switchCategory('SD_PI')"
        >
          SD PI
        </button>
        <button
          class="tab-btn"
          data-cat="SMP_PA"
          onclick="switchCategory('SMP_PA')"
        >
          SMP PA
        </button>
        <button
          class="tab-btn"
          data-cat="SMP_PI"
          onclick="switchCategory('SMP_PI')"
        >
          SMP PI
        </button>
        <button
          class="tab-btn"
          data-cat="SMA_PA"
          onclick="switchCategory('SMA_PA')"
        >
          SMA PA
        </button>
        <button
          class="tab-btn"
          data-cat="SMA_PI"
          onclick="switchCategory('SMA_PI')"
        >
          SMA PI
        </button>
      </div>

      <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
      </div>

      <button id="spinBtn" class="btn-spin" onclick="spin()">SPIN!</button>

      <div id="resultBox" class="result-container">
        <div class="result-label" id="resultLabel">SIAP MEMUTAR</div>
        <div id="resultValue" class="result-value">-</div>
      </div>
    </div>

    <script>
      const colors = [
        "#f43f5e",
        "#8b5cf6",
        "#06b6d4",
        "#10b981",
        "#f59e0b",
        "#ec4899",
        "#3b82f6",
        "#84cc16",
      ];

      const defaultData = {
        SD_PA: {
          items: ["SD PA 1", "SD PA 2", "SD PA 3", "SD PA 4", "SD PA 5"],
          seq: [0, 2, 3, 4, 1],
        },
        SD_PI: {
          items: ["SD PI 1", "SD PI 2", "SD PI 3", "SD PI 4", "SD PI 5"],
          seq: [0, 2, 3, 4, 1],
        },
        SMP_PA: {
          items: ["SMP PA 1", "SMP PA 2", "SMP PA 3", "SMP PA 4", "SMP PA 5"],
          seq: [0, 2, 3, 4, 1],
        },
        SMP_PI: {
          items: ["SMP PI 1", "SMP PI 2", "SMP PI 3", "SMP PI 4", "SMP PI 5"],
          seq: [0, 2, 3, 4, 1],
        },
        SMA_PA: {
          items: ["SMA PA 1", "SMA PA 2", "SMA PA 3", "SMA PA 4", "SMA PA 5"],
          seq: [0, 2, 3, 4, 1],
        },
        SMA_PI: {
          items: ["SMA PI 1", "SMA PI 2", "SMA PI 3", "SMA PI 4", "SMA PI 5"],
          seq: [0, 2, 3, 4, 1],
        },
      };

      let activeCategory = "SD_PA";
      let items = [];
      let sequence = [];
      let disabledIndices = new Set();

      let currentRotation = 0;
      let isSpinning = false;

      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const spinBtn = document.getElementById("spinBtn");
      const resultBox = document.getElementById("resultBox");
      const resultLabel = document.getElementById("resultLabel");
      const resultValue = document.getElementById("resultValue");

      window.onload = () => {
        activeCategory =
          localStorage.getItem("spinner_active_category") || "SD_PA";
        loadSpinnerData(activeCategory);
      };

      function switchCategory(cat) {
        if (isSpinning) return;
        activeCategory = cat;
        localStorage.setItem("spinner_active_category", cat);
        loadSpinnerData(cat);
      }

      function loadSpinnerData(cat) {
        // Update Tab UI
        document.querySelectorAll(".tab-btn").forEach((btn) => {
          if (btn.dataset.cat === cat) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
        });

        // Load Items
        const savedItems = localStorage.getItem(`spinner_items_${cat}`);
        items = savedItems ? JSON.parse(savedItems) : defaultData[cat].items;

        // Load Sequence
        const savedSeq = localStorage.getItem(`spinner_sequence_${cat}`);
        sequence = savedSeq ? JSON.parse(savedSeq) : defaultData[cat].seq;

        // Load Disabled Items
        const savedDisabled = localStorage.getItem(`spinner_disabled_${cat}`);
        disabledIndices = savedDisabled
          ? new Set(JSON.parse(savedDisabled))
          : new Set();

        // Reset Display
        resultBox.classList.remove("active");
        resultValue.classList.remove("animate");

        if (disabledIndices.size >= items.length) {
          spinBtn.disabled = true;
          resultLabel.innerText = "SELESAI";
          resultValue.innerText = "Semua Nilai Telah Terpilih!";
          resultValue.style.color = "#ef4444";
          resultValue.style.fontSize = "1.5rem";
        } else {
          spinBtn.disabled = false;
          resultLabel.innerText = "SIAP MEMUTAR";
          resultValue.innerText = "-";
          resultValue.style.color = "#f59e0b";
          resultValue.style.fontSize = "2.6rem";
        }

        drawWheel();
      }

      function drawWheel() {
        const numOptions = items.length;
        const arcSize = (2 * Math.PI) / numOptions;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numOptions; i++) {
          const angle = i * arcSize;
          const isDisabled = disabledIndices.has(i);

          ctx.beginPath();
          ctx.fillStyle = isDisabled ? "#334155" : colors[i % colors.length];
          ctx.moveTo(radius, radius);
          ctx.arc(radius, radius, radius, angle, angle + arcSize);
          ctx.lineTo(radius, radius);
          ctx.fill();

          ctx.strokeStyle = "#0f172a";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.translate(radius, radius);
          ctx.rotate(angle + arcSize / 2);
          ctx.textAlign = "right";

          const fontSize = Math.max(
            14,
            Math.min(22, Math.floor(300 / numOptions)),
          );
          ctx.font = `900 ${fontSize}px "Segoe UI", sans-serif`;

          const text = items[i];
          const textX = radius - 25;
          const textY = fontSize / 3;

          if (isDisabled) {
            ctx.fillStyle = "#94a3b8";
            ctx.fillText(text, textX, textY);

            const textMetrics = ctx.measureText(text);
            ctx.beginPath();
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 3;
            ctx.moveTo(textX - textMetrics.width, textY - fontSize / 3);
            ctx.lineTo(textX, textY - fontSize / 3);
            ctx.stroke();
          } else {
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 4;
            ctx.lineJoin = "round";
            ctx.strokeText(text, textX, textY);

            ctx.fillStyle = "#ffffff";
            ctx.fillText(text, textX, textY);
          }

          ctx.restore();
        }
      }

      function spin() {
        if (isSpinning) return;
        if (disabledIndices.size >= items.length) return;

        let targetIndex = -1;
        for (let i = 0; i < sequence.length; i++) {
          const candidateIndex = sequence[i];
          if (!disabledIndices.has(candidateIndex)) {
            targetIndex = candidateIndex;
            break;
          }
        }

        if (targetIndex === -1) {
          for (let i = 0; i < items.length; i++) {
            if (!disabledIndices.has(i)) {
              targetIndex = i;
              break;
            }
          }
        }

        resultBox.classList.remove("active");
        resultValue.classList.remove("animate");
        resultLabel.innerText = "MEMUTAR...";
        resultValue.innerText = "...";
        resultValue.style.color = "#94a3b8";
        resultValue.style.fontSize = "2.6rem";

        isSpinning = true;
        spinBtn.disabled = true;

        const numOptions = items.length;
        const sliceAngle = 360 / numOptions;

        const targetSegmentCenter = targetIndex * sliceAngle + sliceAngle / 2;
        const stopAngle = (270 - targetSegmentCenter + 360) % 360;

        const extraRounds = 360 * 5;
        const currentMod = currentRotation % 360;
        let nextRotation =
          currentRotation + (360 - currentMod) + extraRounds + stopAngle;

        canvas.style.transition =
          "transform 4s cubic-bezier(0.15, 0.9, 0.2, 1)";
        canvas.style.transform = `rotate(${nextRotation}deg)`;

        currentRotation = nextRotation;

        setTimeout(() => {
          isSpinning = false;

          disabledIndices.add(targetIndex);
          localStorage.setItem(
            `spinner_disabled_${activeCategory}`,
            JSON.stringify(Array.from(disabledIndices)),
          );

          const isLastItem = disabledIndices.size >= items.length;

          resultLabel.innerText = isLastItem
            ? "HASIL TERAKHIR TERPILIH 🎉"
            : "HASIL TERPILIH 🎉";
          resultValue.innerText = items[targetIndex];
          resultValue.style.color = "#f59e0b";
          resultValue.style.fontSize = "2.6rem";

          resultBox.classList.add("active");
          resultValue.classList.add("animate");

          drawWheel();

          if (isLastItem) {
            spinBtn.disabled = true;
          } else {
            spinBtn.disabled = false;
          }
        }, 4000);
      }

      function resetDisabledItems() {
        if (isSpinning) return;
        if (
          confirm(
            `Reset status terpakai untuk kategori ${activeCategory.replace("_", " ")}?`,
          )
        ) {
          disabledIndices.clear();
          localStorage.removeItem(`spinner_disabled_${activeCategory}`);
          loadSpinnerData(activeCategory);
        }
      }
    </script>
  </body>
</html>
